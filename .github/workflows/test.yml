name: Extended Test Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # 毎日06:00 JST に実行

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build oauth package
      # apps/{web,mobile} は @ryuuhei0729/swimhub-oauth を exports 経由 (= dist/) で解決する。
      # dist は gitignore 対象で checkout では復元されないため明示ビルドする。
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Ensure Rollup native binaries are installed
      run: pnpm add -D @rollup/rollup-linux-x64-gnu --filter @swim-hub/web || true

    - name: Run shared package tests
      run: pnpm --filter @swim-hub/shared test

    - name: Run web package tests
      run: pnpm --filter @swim-hub/web test

    - name: Run oauth package tests
      run: pnpm --filter @ryuuhei0729/swimhub-oauth test

    # playwright.config.ts の webServer は `next start` を使うため、production build が必須。
    # ここが無いと "Could not find a production build in the '.next' directory" で落ちる。
    - name: Build Next.js for E2E tests
      working-directory: apps/web
      run: pnpm run build
      env:
        # ローカルSupabaseのデフォルト値（E2Eテスト用）
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

    # Playwright ブラウザ + ローカル Supabase (migration/テストユーザー込み) の用意。
    # ci.yml の e2e-tests と同一手順のため複合アクションに集約している。
    - name: Setup E2E environment
      uses: ./.github/actions/setup-e2e

    - name: Run E2E tests
      run: pnpm --filter @swim-hub/web test:e2e
      env:
        CI: true
        E2E_SUPABASE_MODE: local
        E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        RESEND_API_KEY: "re_dummy"

    - name: Stop Supabase stack
      if: always()
      run: supabase stop --workdir supabase
      continue-on-error: true

    - name: Generate coverage report
      if: ${{ matrix.node-version == '20.x' }}
      run: |
        pnpm --filter @swim-hub/shared test:coverage
        pnpm --filter @swim-hub/web test:coverage

    - name: Upload coverage to Codecov
      if: ${{ matrix.node-version == '20.x' }}
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
      with:
        files: ./apps/shared/coverage/lcov.info,./apps/web/coverage/lcov.info
        flags: nightly
        name: codecov-nightly
        fail_ci_if_error: false
