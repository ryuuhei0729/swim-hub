name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  # PRとpushで同じグループ名を使用することで重複実行を防ぐ
  # PRの場合はheadブランチ、pushの場合はrefを使用
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.x
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Upload node_modules artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: node-modules
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        retention-days: 1
        compression-level: 9

  lint:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build oauth package
      # apps/{web,mobile} は @ryuuhei0729/swimhub-oauth を exports 経由 (= dist/) で解決する。
      # dist は gitignore 対象で checkout では復元されないため、依存する各ジョブで明示ビルドする。
      # (lint/type-check は `pnpm -r` で turbo を経由しないため dependsOn:["^build"] が効かない)
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Run lint
      run: pnpm -r --if-present lint
      env:
        CI: true

  type-check:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build oauth package
      # apps/{web,mobile} は @ryuuhei0729/swimhub-oauth を exports 経由 (= dist/) で解決する。
      # dist は gitignore 対象で checkout では復元されないため、依存する各ジョブで明示ビルドする。
      # (lint/type-check は `pnpm -r` で turbo を経由しないため dependsOn:["^build"] が効かない)
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Run type check
      run: pnpm -r --if-present type-check

  unit-tests:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20.x ]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build oauth package
      # apps/{web,mobile} は @ryuuhei0729/swimhub-oauth を exports 経由 (= dist/) で解決する。
      # dist は gitignore 対象で checkout では復元されないため、依存する各ジョブで明示ビルドする。
      # (lint/type-check は `pnpm -r` で turbo を経由しないため dependsOn:["^build"] が効かない)
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Ensure Rollup native binaries are installed
      run: pnpm add -D @rollup/rollup-linux-x64-gnu --filter @swim-hub/web || true

    - name: Run shared package tests
      run: pnpm --filter @swim-hub/shared test

    - name: Run web package tests
      run: pnpm --filter @swim-hub/web test

    - name: Run mobile package tests
      # apps/mobile も @ryuuhei0729/swimhub-oauth に依存するようになったため、
      # CI で退行を検知できるようにテストを実行する (従来 CI 未組込のギャップ)。
      run: pnpm --filter @swim-hub/mobile test

    - name: Run oauth package tests
      run: pnpm --filter @ryuuhei0729/swimhub-oauth test

  e2e-build:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore Next.js build cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          apps/web/.next/cache
          apps/web/node_modules/.cache
        key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{ts,tsx,js,jsx}') }}
        restore-keys: |
          nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Build oauth package
      # @ryuuhei0729/swimhub-oauth は exports が dist/** のみを指す npm パッケージで、
      # dist は gitignore 対象。node_modules artifact にも含まれないため、
      # next build / opennextjs-cloudflare build を直接叩くジョブでも明示ビルドが必要。
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Build Next.js for E2E tests
      working-directory: apps/web
      run: pnpm run build
      env:
        # ローカルSupabaseのデフォルト値（E2Eテスト用）
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

    - name: Upload E2E build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-build-output
        path: apps/web/.next
        retention-days: 1
        compression-level: 6
        include-hidden-files: true

  e2e-tests:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Restore Playwright browsers cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Download E2E build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: e2e-build-output
        path: apps/web/.next

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Playwright ブラウザ + ローカル Supabase (migration/テストユーザー込み) の用意。
    # test.yml の regression-tests と同一手順のため複合アクションに集約している。
    - name: Setup E2E environment
      uses: ./.github/actions/setup-e2e

    - name: Run E2E tests (shard ${{ matrix.shard }}/2)
      run: pnpm --filter @swim-hub/web test:e2e --shard=${{ matrix.shard }}/2
      env:
        CI: true
        E2E_SUPABASE_MODE: local
        E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        RESEND_API_KEY: "re_dummy"

    - name: Stop Supabase stack
      if: always()
      run: supabase stop --workdir supabase
      continue-on-error: true

  build:
    needs: [unit-tests, e2e-tests]
    # e2e-testsがスキップされた場合でも実行
    if: always() && needs.unit-tests.result == 'success' && (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build oauth package
      # @ryuuhei0729/swimhub-oauth は exports が dist/** のみを指す npm パッケージで、
      # dist は gitignore 対象。node_modules artifact にも含まれないため、
      # next build / opennextjs-cloudflare build を直接叩くジョブでも明示ビルドが必要。
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Build for Cloudflare (OpenNext)
      working-directory: apps/web
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "=== Building with .env.production ==="
          pnpm exec dotenvx run -f .env.production -- pnpm exec opennextjs-cloudflare build
        else
          echo "=== Building with .env.development ==="
          pnpm exec dotenvx run -f .env.development -- pnpm exec opennextjs-cloudflare build
        fi
      env:
        DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}

    - name: Debug - List build output
      working-directory: apps/web
      run: |
        ls -la .next || echo ".next directory not found"
        ls -la .open-next || echo ".open-next directory not found"

    - name: Upload build output artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-output
        path: |
          apps/web/.next
          apps/web/.open-next
        retention-days: 1
        compression-level: 9
        if-no-files-found: error
        include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Download build output artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-output
        path: apps/web

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Debug - Check downloaded artifacts
      working-directory: apps/web
      run: |
        echo "=== apps/web contents ==="
        ls -la
        echo "=== .next exists? ==="
        ls -la .next || echo ".next not found"
        echo "=== .open-next exists? ==="
        ls -la .open-next || echo ".open-next not found"

    - name: Deploy to Cloudflare Workers
      working-directory: apps/web
      run: |
        # 暗号化された.env.productionをリネームしてOpenNextが読まないようにする
        mv .env.production .env.production.skip || true
        pnpm run deploy:only
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.build.result == 'success' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    concurrency:
      group: deploy-preview
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download node_modules artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: node-modules
        path: .

    - name: Download build output artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-output
        path: apps/web

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Deploy to Cloudflare Workers (Preview)
      working-directory: apps/web
      run: |
        # 暗号化された.env.developmentをリネームしてOpenNextが読まないようにする
        mv .env.development .env.development.skip || true
        pnpm exec wrangler deploy --env preview
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
