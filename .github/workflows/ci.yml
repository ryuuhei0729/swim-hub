name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  # PRとpushで同じグループ名を使用することで重複実行を防ぐ
  # PRの場合はheadブランチ、pushの場合はrefを使用
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  # 各ジョブは setup-node で pnpm store キャッシュから install する (約 20 秒)。
  # 以前は node_modules を artifact で配っていたが、圧縮付きアップロードだけで 3 分近くかかり、
  # 受け取った側も結局 install していたので廃止した。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build oauth package
      # apps/{web,mobile} は @ryuuhei0729/swimhub-oauth を exports 経由 (= dist/) で解決する。
      # dist は gitignore 対象で checkout では復元されないため、依存する各ジョブで明示ビルドする。
      # (lint/type-check は `pnpm -r` で turbo を経由しないため dependsOn:["^build"] が効かない)
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Run lint
      run: pnpm -r --if-present lint
      env:
        CI: true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build oauth package
      # apps/{web,mobile} は @ryuuhei0729/swimhub-oauth を exports 経由 (= dist/) で解決する。
      # dist は gitignore 対象で checkout では復元されないため、依存する各ジョブで明示ビルドする。
      # (lint/type-check は `pnpm -r` で turbo を経由しないため dependsOn:["^build"] が効かない)
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Run type check
      run: pnpm -r --if-present type-check

  unit-tests:
    # lint / type-check を待たずに並行して走らせる。デプロイを止める判定は build の needs で行う
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x ]
        # 1 ジョブで順に回すと web と mobile の合計がそのまま待ち時間になるので、パッケージごとに分ける
        package: [ shared, web, mobile ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build oauth package
      # apps/{web,mobile} は @ryuuhei0729/swimhub-oauth を exports 経由 (= dist/) で解決する。
      # dist は gitignore 対象で checkout では復元されないため、依存する各ジョブで明示ビルドする。
      # (lint/type-check は `pnpm -r` で turbo を経由しないため dependsOn:["^build"] が効かない)
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Run shared package tests
      if: matrix.package == 'shared'
      run: pnpm --filter @swim-hub/shared test

    - name: Run oauth package tests
      # 数秒で終わるので、専用のジョブは立てず shared と同じジョブで回す
      if: matrix.package == 'shared'
      run: pnpm --filter @ryuuhei0729/swimhub-oauth test

    - name: Run web package tests
      if: matrix.package == 'web'
      run: pnpm --filter @swim-hub/web test

    - name: Run mobile package tests
      # apps/mobile も @ryuuhei0729/swimhub-oauth に依存するようになったため、
      # CI で退行を検知できるようにテストを実行する (従来 CI 未組込のギャップ)。
      if: matrix.package == 'mobile'
      run: pnpm --filter @swim-hub/mobile test

    - name: Run mobile navigation integration tests
      if: matrix.package == 'mobile'
      # 既定の mobile テストは react-native を静的モックに、@react-navigation/* を
      # スタブに差し替えているため、**BottomTabBar の実 onPress が一度も走らない**。
      # 実際にそこで起きたバグ (リスナー内の同期 push が既定 dispatch に打ち消され、
      # 他タブからのチームタブ直行が消える) は既定スイートでは原理的に検出できず、
      # 全 green のまま本番まで通った。
      #
      # このプロジェクトだけ react-native を react-native-web で解決し、本物の
      # NavigationContainer / Stack / Tab を組んで実際にタブを押す。設定が
      # 既定と両立しないため別 config で分離しており、`test` では実行されない。
      # **このステップを消すと 6 件が永久に実行されなくなる。**
      run: pnpm --filter @swim-hub/mobile test:nav

  e2e-build:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore Next.js build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          apps/web/.next/cache
          apps/web/node_modules/.cache
        key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{ts,tsx,js,jsx}') }}
        restore-keys: |
          nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Build oauth package
      # @ryuuhei0729/swimhub-oauth は exports が dist/** のみを指す npm パッケージで、
      # dist は gitignore 対象で checkout では復元されないため、
      # next build / opennextjs-cloudflare build を直接叩くジョブでも明示ビルドが必要。
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Build Next.js for E2E tests
      working-directory: apps/web
      run: pnpm run build
      env:
        # ローカルSupabaseのデフォルト値（E2Eテスト用）
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

    - name: Upload E2E build artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-build-output
        path: apps/web/.next
        retention-days: 1
        compression-level: 6
        include-hidden-files: true

  e2e-tests:
    needs: e2e-build
    # ubuntu-latest が 26.04 になり、Playwright 1.58 は chromium を入れられない
    # (`Playwright does not support chromium on ubuntu26.04-x64`)。対応版に上げるまで 24.04 に固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Restore Playwright browsers cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Playwright の既定のインストール先。以前は PLAYWRIGHT_BROWSERS_PATH に `~/.cache/ms-playwright` を
        # 渡していたが、Playwright は `~` を展開せずカレント配下の `~` ディレクトリに入れるため、
        # このパスには何も無く、キャッシュが一度も保存されていなかった
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Download E2E build artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: e2e-build-output
        path: apps/web/.next

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Playwright ブラウザ + ローカル Supabase (migration/テストユーザー込み) の用意。
    # test.yml の regression-tests と同一手順のため複合アクションに集約している。
    - name: Setup E2E environment
      uses: ./.github/actions/setup-e2e

    - name: Run E2E tests (shard ${{ matrix.shard }}/2)
      run: pnpm --filter @swim-hub/web test:e2e --shard=${{ matrix.shard }}/2
      env:
        CI: true
        E2E_SUPABASE_MODE: local
        E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        RESEND_API_KEY: "re_dummy"

    - name: Stop Supabase stack
      if: always()
      run: supabase stop --workdir supabase
      continue-on-error: true

  build:
    needs: [lint, type-check, unit-tests, e2e-build, e2e-tests]
    # e2e を実行しないイベント (develop への push) では e2e-build / e2e-tests とも skipped になるので、それは通す。
    # 上流が落ちたときも依存先は skipped になるため、skipped だけを見ると失敗のまま deploy まで進む。
    # lint / type-check と e2e-build は直接確認する
    if: always() && needs.lint.result == 'success' && needs.type-check.result == 'success' && needs.unit-tests.result == 'success' && (needs.e2e-tests.result == 'success' || (needs.e2e-tests.result == 'skipped' && needs.e2e-build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build oauth package
      # @ryuuhei0729/swimhub-oauth は exports が dist/** のみを指す npm パッケージで、
      # dist は gitignore 対象で checkout では復元されないため、
      # next build / opennextjs-cloudflare build を直接叩くジョブでも明示ビルドが必要。
      run: pnpm --filter @ryuuhei0729/swimhub-oauth build

    - name: Build for Cloudflare (OpenNext)
      working-directory: apps/web
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "=== Building with .env.production ==="
          pnpm exec dotenvx run -f .env.production -- pnpm exec opennextjs-cloudflare build
        else
          echo "=== Building with .env.development ==="
          pnpm exec dotenvx run -f .env.development -- pnpm exec opennextjs-cloudflare build
        fi
      env:
        DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}

    - name: Debug - List build output
      working-directory: apps/web
      run: |
        ls -la .next || echo ".next directory not found"
        ls -la .open-next || echo ".open-next directory not found"

    - name: Upload build output artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-output
        path: |
          apps/web/.next
          apps/web/.open-next
        retention-days: 1
        compression-level: 9
        if-no-files-found: error
        include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download build output artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-output
        path: apps/web

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Debug - Check downloaded artifacts
      working-directory: apps/web
      run: |
        echo "=== apps/web contents ==="
        ls -la
        echo "=== .next exists? ==="
        ls -la .next || echo ".next not found"
        echo "=== .open-next exists? ==="
        ls -la .open-next || echo ".open-next not found"

    - name: Deploy to Cloudflare Workers
      working-directory: apps/web
      run: |
        # 暗号化された.env.productionをリネームしてOpenNextが読まないようにする
        mv .env.production .env.production.skip || true
        pnpm run deploy:only
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.build.result == 'success' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    concurrency:
      group: deploy-preview
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download build output artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-output
        path: apps/web

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Deploy to Cloudflare Workers (Preview)
      working-directory: apps/web
      run: |
        # 暗号化された.env.developmentをリネームしてOpenNextが読まないようにする
        mv .env.development .env.development.skip || true
        pnpm exec wrangler deploy --env preview
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
