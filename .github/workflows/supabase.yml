name: Supabase Database

# push トリガに develop を含める。開発は develop に直接 push される運用のため
# main 限定だと Edge Function を変更しても main にマージされるまで一度も検証されず、
# 壊れたまま develop に積み上がってしまう (実際に本ワークフローが走らないまま
# Edge Function の変更が develop に入った)。
#
# paths には deno.lock とこのワークフロー自身も含める。テスト/型チェックは
# deno.lock を --frozen で参照しており、lock だけの変更やワークフロー自体の変更でも
# 結果が変わるため、これらを対象外にすると検証を素通りさせてしまう。
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'deno.lock'
      - '.github/workflows/supabase.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'deno.lock'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: '20.x'

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
      with:
        version: latest

    - name: Configure Supabase for CI environment
      run: |
        # CI環境ではGoogle OAuthを無効化（ダミー値で警告を抑制）
        sed -i '/\[auth\.external\.google\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml || {
          echo "⚠️ Google OAuthの無効化に失敗しました。"
          exit 1
        }
      env:
        SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "dummy-client-id"
        SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "dummy-secret"

    - name: Start Supabase stack
      # `supabase start` が migrations を適用する。edge-runtime は不要なため除外
      run: supabase start --workdir supabase --exclude edge-runtime
      timeout-minutes: 8
      env:
        SUPABASE_DB_PASSWORD: postgres
        SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "dummy-client-id"
        SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "dummy-secret"

    - name: Type check migrations
      # `supabase db type-check` は CLI から廃止されたため `db lint` を使用。
      # 起動済みローカルDBに対して plpgsql の型エラーを検査する
      run: supabase db lint --workdir supabase --level error --fail-on error

    - name: Stop Supabase stack
      if: always()
      run: supabase stop --workdir supabase
      continue-on-error: true

  migration-test:
    needs: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Node.js and Install dependencies
      uses: ./.github/actions/setup-node
      with:
        node-version: '20.x'

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
      with:
        version: latest

    - name: Configure Supabase for CI environment
      run: |
        # CI環境用の設定を準備
        echo "🔧 CI環境用のSupabase設定を準備中..."

        # CI環境でGoogle OAuthを無効化（JWT署名鍵はデフォルトを使用）
        echo "🔒 Google OAuthを無効化中..."
        # [auth.external.google]セクションのenabled = trueをfalseに変更
        sed -i '/\[auth\.external\.google\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml || {
          echo "⚠️ Google OAuthの無効化に失敗しました。"
          exit 1
        }
        echo "✅ config.tomlを更新しました（Google OAuthを無効化、JWT署名鍵はデフォルトを使用）"
      env:
        # CI環境ではGoogle OAuthは不要なため、ダミー値を設定して警告を抑制
        SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "dummy-client-id"
        SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "dummy-secret"

    - name: Start Supabase stack
      # edge-runtime を除外して起動安定性を向上（functions test は Deno で直接実行）
      run: supabase start --workdir supabase --exclude edge-runtime
      timeout-minutes: 8
      env:
        SUPABASE_DB_PASSWORD: postgres
        # CI環境ではGoogle OAuthは不要なため、ダミー値を設定して警告を抑制
        SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "dummy-client-id"
        SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "dummy-secret"

    - name: Wait for Supabase to be ready
      run: |
        echo "⏳ Supabaseコンテナの起動を待機中..."
        for i in {1..30}; do
          if curl -s -f http://127.0.0.1:54321/rest/v1/ > /dev/null 2>&1; then
            echo "✅ Supabaseが起動しました"
            exit 0
          fi
          sleep 1
        done
        echo "⚠️ Supabaseの起動確認がタイムアウトしましたが、続行します"

    - name: Reset database
      run: |
        # データベースを直接リセット（コンテナ再起動なし）
        # これにより、コンテナ再起動時のJWT署名鍵読み込み問題を回避
        echo "🔄 データベースをリセット中..."

        DB_CONTAINER=$(docker ps --filter "name=supabase_db" --format "{{.Names}}" | head -n 1)
        if [ -z "$DB_CONTAINER" ]; then
          echo "❌ データベースコンテナが見つかりません"
          exit 1
        fi

        echo "📦 データベースコンテナ: $DB_CONTAINER"

        # データベースをリセット（すべてのスキーマを削除）
        docker exec "$DB_CONTAINER" psql -U postgres -d postgres -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres; GRANT ALL ON SCHEMA public TO public;" || {
          echo "⚠️ データベースリセットに失敗しました"
          exit 1
        }

        echo "✅ データベースのリセットが完了しました"
      env:
        SUPABASE_DB_PASSWORD: postgres

    - name: Apply migrations (psql)
      run: |
        DB_CONTAINER=$(docker ps --filter "name=supabase_db" --format "{{.Names}}" | head -n 1)
        if [ -z "$DB_CONTAINER" ]; then
          echo "❌ DB container not found"
          exit 1
        fi

        echo "📦 Applying migrations via psql"

        for file in supabase/migrations/*.sql; do
          echo "➡️ Applying $file"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres < "$file"
        done
      env:
        SUPABASE_DB_PASSWORD: postgres

    # supabase/setup-cli は Supabase CLI のみを導入し、deno バイナリは PATH に置かないため
    # 別途セットアップする。ローカル検証で使用したバージョンとCIで揃えることで、
    # 「ローカルでは通るがCIでは挙動が違う」ドリフトを防ぐ。
    - name: Setup Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: "2.9.4"

    # Edge Function は esm.sh / deno.land から直接 import しており、CDN が 5xx を返すと
    # コードが正しくても CI が落ちる (swimhub-scanner で esm.sh の 522 により実際に発生)。
    # deno.lock が全依存を integrity ハッシュ付きで固定しているため、DENO_DIR をキャッシュして
    # 通常の実行では CDN に一切触らせない。
    - name: Cache Deno modules
      uses: actions/cache@v4
      with:
        path: ~/.cache/deno
        key: deno-2.9.4-${{ runner.os }}-${{ hashFiles('deno.lock') }}
        restore-keys: |
          deno-2.9.4-${{ runner.os }}-

    # キャッシュミス時のみ CDN を叩く。ダウンロードだけをリトライ対象にすることで、
    # 「CDN の一時障害」は再試行し「テストの失敗」は再試行しない (flaky test を隠さない)。
    # --frozen を全 .ts に掛けることで deno.lock のカバレッジ不足も CI で検知する。
    - name: Warm Deno module cache
      run: |
        fn_files=()
        while IFS= read -r f; do fn_files+=("$f"); done \
          < <(find supabase/functions -name '*.ts' | sort)
        if [ ${#fn_files[@]} -eq 0 ]; then
          echo "supabase/functions 配下に .ts が無いためスキップ"
          exit 0
        fi
        for attempt in 1 2 3; do
          if deno cache --frozen "${fn_files[@]}"; then
            exit 0
          fi
          echo "::warning::deno cache failed (attempt ${attempt}/3)"
          sleep $((attempt * 15))
        done
        echo "::error::deno cache failed after 3 attempts (CDN 障害か deno.lock が古い)"
        exit 1

    # デプロイされる Edge Function 本体の型チェック。Node 側の tsconfig は
    # supabase/functions/ を対象外にしており、テストも delete-user-storage しか
    # カバーしていないため、stripe/revenucat webhook や scan-timesheet の型崩れは
    # 従来どこにも引っかからなかった (実際に 18 件の型エラーが潜んでいた)。
    # Warm step で全依存をキャッシュ済みのためネットワークアクセスは発生しない。
    - name: Type check Edge Functions
      run: |
        fn_files=()
        while IFS= read -r f; do fn_files+=("$f"); done \
          < <(find supabase/functions -name '*.ts' | sort)
        if [ ${#fn_files[@]} -eq 0 ]; then
          echo "supabase/functions 配下に .ts が無いためスキップ"
          exit 0
        fi
        deno check --frozen "${fn_files[@]}"

    # `supabase functions test` は CLI から廃止されたため Deno で直接テストを実行する。
    # 実テストファイル（*.test.ts / *_test.ts）が存在する場合のみ実行する。
    #
    # --cached-only: Warm step で取得済みの依存のみ使用 (テスト中はネットワークに出ない)。
    # --frozen:      deno.lock に無い依存が混入した場合に CI で検知する。
    - name: Test Edge Functions
      if: ${{ hashFiles('supabase/functions/**/*.test.ts', 'supabase/functions/**/*_test.ts') != '' }}
      run: deno test --allow-all --cached-only --frozen supabase/functions/

    - name: Stop Supabase stack
      if: always()
      run: supabase stop --workdir supabase
      continue-on-error: true
