# AI テスター: モバイルアプリをビルドし、ペルソナごとに 1 台のエミュレーター / シミュレーターを用意して、
# ヘッドレスの Claude Code エージェントに新規ユーザーとして触らせる。
# 公開リポジトリのログとアーティファクトは誰でも見られるため、ビルドログ・アプリ・スクリーンショット・
# レポートはすべて tools/agent-testers/results_public.pem で暗号化してからアップロードする。
# 復号は手元で: bash tools/agent-testers/collect.sh <run id>
# 詳細: tools/agent-testers/README.md
# Based on pierridotite/mobile-agent-testers (MIT, see tools/agent-testers/LICENSE.upstream)
name: Agent testers

on:
  workflow_dispatch:
    inputs:
      android_personas:
        description: personas.json の Android ペルソナ (カンマ区切り / all / none)
        default: "haruto,sachiko"
      ios_personas:
        description: personas.json の iOS ペルソナ (カンマ区切り / all / none)
        default: "yui,sato"
      brief:
        description: エージェントへの指示 (tools/agent-testers/ 内の .md)
        default: AGENT_BRIEF.md
      model:
        description: Claude のモデル (エイリアスまたは ID)
        default: sonnet
      block_hosts:
        description: テスト中にアプリから到達させないホスト (スペース区切り)
        default: ""
      record_video:
        description: 各端末の画面録画 (結果と一緒に暗号化)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-testers
  cancel-in-progress: false

env:
  NODE_VERSION: 22.x
  CLAUDE_CODE_VERSION: 2.1.318
  PILLOW_VERSION: 13.0.0
  AXE_VERSION: v2.0.4
  AXE_SHA256: 3178ec66d9ff46455fec737debad719c41cab16edb1435b2c721e07760a208c3

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.m.outputs.android }}
      ios: ${{ steps.m.outputs.ios }}
    defaults:
      run:
        working-directory: tools/agent-testers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check setup and inputs
        env:
          BRIEF: ${{ inputs.brief }}
          MODEL: ${{ inputs.model }}
          HOSTS: ${{ inputs.block_hosts }}
        run: |
          test -s results_public.pem || { echo "::error::results_public.pem がありません: tools/agent-testers/setup.sh を実行してコミットしてください"; exit 1; }
          # 正規表現は変数に入れて渡す ([[ =~ ]] に直接書くとブラケット内のエスケープが効かない)
          brief_re='^[A-Za-z0-9_.-]+\.md$'
          model_re='^[][A-Za-z0-9._-]+$'   # 先頭の ] と [ で "claude-opus-5-5[1m]" のような ID も通す
          hosts_re='^[A-Za-z0-9. -]*$'
          [[ "$BRIEF" =~ $brief_re ]] && [ -f "$BRIEF" ] || { echo "::error::brief は tools/agent-testers/ 内の .md ファイル名で指定してください"; exit 1; }
          [[ "$MODEL" =~ $model_re ]] || { echo "::error::model が不正です: $MODEL"; exit 1; }
          [[ "$HOSTS" =~ $hosts_re ]] || { echo "::error::block_hosts が不正です"; exit 1; }
      - id: m
        env:
          A: ${{ inputs.android_personas }}
          I: ${{ inputs.ios_personas }}
        run: |
          PERSONAS="$A" PLATFORM=android python3 scripts/matrix.py >> "$GITHUB_OUTPUT"
          PERSONAS="$I" PLATFORM=ios python3 scripts/matrix.py >> "$GITHUB_OUTPUT"

  build-android:
    needs: plan
    if: needs.plan.outputs.android != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and Install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build oauth package
        run: pnpm --filter @ryuuhei0729/swimhub-oauth build
      - name: Build APK (development 環境, ログは暗号化)
        working-directory: apps/mobile
        env:
          # apps/mobile/.env.development は web/ルートとは別の鍵で暗号化されている (apps/mobile/.env.keys)
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT_MOBILE }}
        run: pnpm exec dotenvx run --strict -f .env.development -- bash ../../tools/agent-testers/scripts/build/android.sh
      - name: Encrypt APK
        working-directory: tools/agent-testers
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: mkdir -p out && openssl enc -aes-256-cbc -pbkdf2 -salt -in app.apk -out out/app.apk.enc -pass env:ARTIFACT_PASSPHRASE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-android
          path: tools/agent-testers/out/
          retention-days: 3
      - name: Encrypt build log
        if: always()
        working-directory: tools/agent-testers
        run: bash scripts/encrypt_results.sh build-log-android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-log-android
          path: tools/agent-testers/results.enc/
          retention-days: 7

  build-ios:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Setup Node.js and Install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build oauth package
        run: pnpm --filter @ryuuhei0729/swimhub-oauth build
      - name: Build Simulator .app (development 環境, ログは暗号化)
        working-directory: apps/mobile
        env:
          # apps/mobile/.env.development は web/ルートとは別の鍵で暗号化されている (apps/mobile/.env.keys)
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT_MOBILE }}
        run: pnpm exec dotenvx run --strict -f .env.development -- bash ../../tools/agent-testers/scripts/build/ios.sh
      - name: Encrypt .app
        working-directory: tools/agent-testers
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: mkdir -p out && openssl enc -aes-256-cbc -pbkdf2 -salt -in app-ios.tgz -out out/app-ios.tgz.enc -pass env:ARTIFACT_PASSPHRASE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-ios
          path: tools/agent-testers/out/
          retention-days: 3
      - name: Encrypt build log
        if: always()
        working-directory: tools/agent-testers
        run: bash scripts/encrypt_results.sh build-log-ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-log-ios
          path: tools/agent-testers/results.enc/
          retention-days: 7

  android:
    needs: [plan, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/agent-testers
    strategy:
      fail-fast: false
      max-parallel: 5 # Claude の使用量: README の「費用と制限」を参照
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.android) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-android
          path: tools/agent-testers
      - name: Decrypt APK
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in app.apk.enc -out app.apk -pass env:ARTIFACT_PASSPHRASE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tools (Pillow, Claude Code)
        run: |
          python3 -m pip install -q "pillow==$PILLOW_VERSION"
          npm install -g --silent "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # エミュレーターは DNS をホスト経由で引く (-dns-server 127.0.0.1):
      # dnsmasq がブロック対象に 0.0.0.0 を返し、iptables が実 IP への通信を落とす。
      # block_hosts が空なら公開 DNS を直接使う。指定しないとエミュレーターはホストの /etc/resolv.conf
      # (Ubuntu ランナーでは 127.0.0.53 の systemd-resolved) を使おうとして名前解決できない
      - name: Block hosts
        id: block
        env:
          HOSTS: ${{ inputs.block_hosts }}
        run: |
          if [ -z "${HOSTS// /}" ]; then echo "emu_dns=-dns-server 8.8.8.8,1.1.1.1" >> "$GITHUB_OUTPUT"; echo "No hosts to block"; exit 0; fi
          sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq dnsutils >/dev/null; }
          { printf 'listen-address=127.0.0.1\nbind-interfaces\nno-resolv\nserver=8.8.8.8\nserver=1.1.1.1\n'
            for h in $HOSTS; do printf 'address=/%s/0.0.0.0\naddress=/%s/::\n' "$h" "$h"; done; } | sudo tee /etc/dnsmasq.d/block.conf >/dev/null
          sudo systemctl restart dnsmasq
          # dnsmasq が実際に名前解決できることを確かめてからエミュレーターに使わせる
          dig +short +time=3 +tries=2 A www.google.com @127.0.0.1 | grep -qE '^[0-9.]+$' || { echo "::error::dnsmasq on 127.0.0.1 does not resolve"; sudo systemctl status dnsmasq --no-pager || true; exit 1; }
          for h in $HOSTS; do for ip in $(dig +short A "$h" @8.8.8.8 | grep -E '^[0-9.]+$'); do sudo iptables -I OUTPUT -d "$ip" -j REJECT; done; done
          echo "emu_dns=-dns-server 127.0.0.1" >> "$GITHUB_OUTPUT"

      - name: Device profile (fallback to pixel_6)
        id: profile
        env:
          WANTED: ${{ matrix.profile }}
        run: |
          if "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device -c 2>/dev/null | grep -qx "$WANTED"; then echo "profile=$WANTED" >> "$GITHUB_OUTPUT"
          else echo "profile=pixel_6" >> "$GITHUB_OUTPUT"; echo "Profile $WANTED missing, pixel_6 used" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator + agent
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_LOGIN_EMAIL: ${{ secrets.AGENT_TESTERS_LOGIN_EMAIL }}
          TEST_LOGIN_PASSWORD: ${{ secrets.AGENT_TESTERS_LOGIN_PASSWORD }}
          PERSONA: ${{ matrix.persona }}
          DEVICE: ${{ matrix.device }}
          FONT_SCALE: ${{ matrix.font_scale }}
          NAV: ${{ matrix.nav }}
          THEME: ${{ matrix.theme }}
          LOCALE: ${{ matrix.locale }}
          GEO: ${{ matrix.geo }}
          APP_ID: app.swimhub
          BRIEF: ${{ inputs.brief }}
          MODEL: ${{ inputs.model }}
          BLOCK_HOSTS: ${{ inputs.block_hosts }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        with:
          working-directory: tools/agent-testers
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ steps.profile.outputs.profile }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ steps.block.outputs.emu_dns }}
          script: bash scripts/android/run_agent.sh

      - name: Encrypt results
        if: always()
        env:
          PERSONA: ${{ matrix.persona }}
        run: bash scripts/encrypt_results.sh "$PERSONA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.persona }}
          path: tools/agent-testers/results.enc/
          retention-days: 14

  ios:
    needs: [plan, build-ios]
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/agent-testers
    strategy:
      fail-fast: false
      max-parallel: 5 # 公開リポジトリの無料枠: macOS は同時 5 ジョブまで
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-ios
          path: tools/agent-testers
      - name: Decrypt .app
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in app-ios.tgz.enc -out app-ios.tgz -pass env:ARTIFACT_PASSPHRASE
          mkdir -p app && tar xzf app-ios.tgz -C app
      - name: Latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tools (AXe, Pillow, Claude Code)
        run: |
          # AXe はリリースの tarball をハッシュで固定して入れる (brew tap の更新に追従しない)
          curl -fsSL -o "$RUNNER_TEMP/axe.tgz" "https://github.com/cameroncooke/AXe/releases/download/$AXE_VERSION/AXe-macOS-$AXE_VERSION-universal.tar.gz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tgz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axe" && tar xzf "$RUNNER_TEMP/axe.tgz" -C "$RUNNER_TEMP/axe"
          (cd "$RUNNER_TEMP/axe" && { codesign -v axe 2>/dev/null || codesign --force --sign - --timestamp=none Frameworks/*.framework axe; })
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/axe/axe" --version
          python3 -m pip install -q "pillow==$PILLOW_VERSION"
          npm install -g --silent "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # シミュレーターは Mac のネットワークを使う: /etc/hosts と pf でブロックする。
      - name: Block hosts
        env:
          HOSTS: ${{ inputs.block_hosts }}
        run: |
          IPS=""
          for h in $HOSTS; do
            IPS="$IPS $(dig +short A "$h" @8.8.8.8 | grep -E '^[0-9.]+$' | tr '\n' ' ')"
            printf '0.0.0.0 %s\n:: %s\n' "$h" "$h" | sudo tee -a /etc/hosts >/dev/null
          done
          [ -n "${IPS// /}" ] && echo "block drop out quick proto { tcp udp } to { $(echo $IPS | tr ' ' ',') }" | sudo pfctl -a com.apple/agentblock -f - 2>/dev/null
          sudo pfctl -E 2>/dev/null || true
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true

      - name: Simulator
        env:
          MODEL_NAME: ${{ matrix.simulator }}
          IOS_MAJOR: ${{ matrix.ios }}
          LOCALE: ${{ matrix.locale }}
        run: |
          # 実機と同じくソフトウェアキーボードを出す
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          python3 scripts/ios/create_sim.py "$MODEL_NAME" "$IOS_MAJOR" | tee -a "$GITHUB_ENV" > "$RUNNER_TEMP/sim.env"
          UDID=$(grep '^UDID=' "$RUNNER_TEMP/sim.env" | cut -d= -f2)
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b >/dev/null
          d() { xcrun simctl spawn "$UDID" defaults write "$@"; }
          L="${LOCALE:-en-US}"
          d -g AppleLanguages -array "$L"; d -g AppleLocale -string "${L/-/_}"
          # 合成キーイベントは US のキーコード: US QWERTY 配列のままにする
          d -g AppleKeyboards -array "en_US@sw=QWERTY;hw=US"
          d com.apple.Preferences KeyboardLastUsed -string "en_US@sw=QWERTY;hw=US"
          for k in KeyboardAutocapitalization KeyboardAutocorrection KeyboardPrediction KeyboardCheckSpelling; do d com.apple.Preferences $k -bool NO; done
          for k in DidShowContinuousPathIntroduction KeyboardDidShowProductivityTutorial DidShowGestureKeyboardIntroduction; do
            d com.apple.Preferences $k -bool YES; d com.apple.keyboard.preferences $k -bool YES
          done
          xcrun simctl shutdown "$UDID" && xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b >/dev/null

      - name: Agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_LOGIN_EMAIL: ${{ secrets.AGENT_TESTERS_LOGIN_EMAIL }}
          TEST_LOGIN_PASSWORD: ${{ secrets.AGENT_TESTERS_LOGIN_PASSWORD }}
          PERSONA: ${{ matrix.persona }}
          TEXT_SIZE: ${{ matrix.text_size }}
          THEME: ${{ matrix.theme }}
          LOCALE: ${{ matrix.locale }}
          GEO: ${{ matrix.geo }}
          APP_ID: app.swimhub
          BRIEF: ${{ inputs.brief }}
          MODEL: ${{ inputs.model }}
          BLOCK_HOSTS: ${{ inputs.block_hosts }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: bash scripts/ios/run_agent.sh

      - name: Encrypt results
        if: always()
        env:
          PERSONA: ${{ matrix.persona }}
        run: bash scripts/encrypt_results.sh "$PERSONA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.persona }}
          path: tools/agent-testers/results.enc/
          retention-days: 14
